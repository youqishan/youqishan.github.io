<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日记查看</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-body {
            padding: 1rem;
            background: white;
            border-radius: 0.75rem;
            line-height: 1.7;
        }
        .markdown-body h1 { font-size: 1.8rem; font-weight: bold; margin-bottom: 0.8rem; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.6rem; }
        .markdown-body h3 { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.4rem; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body code {
            background: #f3f4f6;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.9em;
        }
        .markdown-body pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        .markdown-body blockquote {
            border-left: 4px solid #9ca3af;
            padding-left: 1rem;
            color: #4b5563;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-3xl w-full">
        <h2 id="diaryTitle" class="text-2xl font-bold text-primary mb-2">日记</h2>
        <p id="diaryDate" class="text-gray-500 mb-6"></p>
        
        <div id="diaryContent" class="markdown-body">
            <!-- 渲染内容将显示在这里 -->
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-secondary hover:underline text-sm">
                <i class="fa-solid fa-arrow-left mr-1"></i>返回日历
            </a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dateStr = urlParams.get('date');
        const contentDiv = document.getElementById('diaryContent');
        const dateEl = document.getElementById('diaryDate');

        // 构造 GitHub Raw URL
        const rawUrl = `https://raw.githubusercontent.com/youqishan/youqishan.github.io/master/my_work/diary/${dateStr}.md`;

        async function loadDiary() {
            if (!dateStr || dateStr.length !== 8) {
                contentDiv.innerHTML = '<p class="text-red-500">无效的日期</p>';
                return;
            }

            const year = dateStr.substring(0, 4);
            const month = dateStr.substring(4, 6);
            const day = dateStr.substring(6, 8);
            dateEl.textContent = `${year}年${month}月${day}日`;

            try {
                const response = await fetch(rawUrl);
                if (response.ok) {
                    const markdown = await response.text();
                    contentDiv.innerHTML = marked.parse(markdown);
                } else {
                    contentDiv.innerHTML = '<p class="text-gray-400 italic">暂无日记</p>';
                }
            } catch (e) {
                contentDiv.innerHTML = '<p class="text-red-500">加载失败，请检查网络</p>';
            }
        }

        loadDiary();
    </script>
</body>
</html>
