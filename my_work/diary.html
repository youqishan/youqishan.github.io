<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>日记查看</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .markdown-body {
            padding: 1rem;
            background: white;
            border-radius: 0.75rem;
            line-height: 1.7;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .markdown-body h1 { font-size: 1.8rem; font-weight: bold; margin-bottom: 0.8rem; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.6rem; }
        .markdown-body h3 { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.4rem; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body code {
            background: #f3f4f6;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.9em;
            word-break: break-all;
        }
        .markdown-body pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        .markdown-body blockquote {
            border-left: 4px solid #9ca3af;
            padding-left: 1rem;
            color: #4b5563;
            margin-bottom: 1rem;
        }
        .markdown-body a {
            color: #3498db;
            text-decoration: underline;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-3xl w-full">
        <h2 id="diaryTitle" class="text-2xl font-bold text-primary mb-2">日记</h2>
        <p id="diaryDate" class="text-gray-500 mb-6"></p>
        
        <div id="diaryContent" class="markdown-body">
            <!-- 渲染内容将显示在这里 -->
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-secondary hover:underline text-sm">
                <i class="fa-solid fa-arrow-left mr-1"></i>返回日历
            </a>
        </div>
    </div>

    <script>
        // --- 简易 Markdown 解析器 (不再依赖 marked.js) ---
        function simpleMarkdownParser(md) {
            if (!md) return '';

            let html = md;

            // 转义 HTML 特殊字符，防止 XSS
            html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // 标题 (### 和 ## 和 #)
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // 粗体和斜体
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

            // 行内代码
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // 链接
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

            // 无序列表 (简单情况，以 - 或 * 开头)
            html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>(\n|$))+/g, '<ul>$&</ul>');

            // 段落 (将连续的非空行包裹在 <p> 标签中)
            const lines = html.split('\n');
            let inParagraph = false;
            let result = [];
            let buffer = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                // 跳过已有的 HTML 块级标签行
                if (/^\s*<(h[1-6]|ul|ol|li|pre|blockquote)/.test(line) || /^\s*<\/(ul|ol)>/.test(line)) {
                    if (buffer.length > 0) {
                        result.push('<p>' + buffer.join(' ') + '</p>');
                        buffer = [];
                    }
                    result.push(line);
                } else if (line.trim() === '') {
                    if (buffer.length > 0) {
                        result.push('<p>' + buffer.join(' ') + '</p>');
                        buffer = [];
                    }
                } else {
                    buffer.push(line);
                }
            }
            if (buffer.length > 0) {
                result.push('<p>' + buffer.join(' ') + '</p>');
            }
            html = result.join('\n');

            return html;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const dateStr = urlParams.get('date');
        const contentDiv = document.getElementById('diaryContent');
        const dateEl = document.getElementById('diaryDate');

        // 构造 GitHub Raw URL
        const rawUrl = `https://raw.githubusercontent.com/youqishan/youqishan.github.io/master/my_work/diary/${dateStr}.md`;

        async function loadDiary() {
            if (!dateStr || dateStr.length !== 8) {
                contentDiv.innerHTML = '<p class="text-red-500">无效的日期</p>';
                return;
            }

            const year = dateStr.substring(0, 4);
            const month = dateStr.substring(4, 6);
            const day = dateStr.substring(6, 8);
            dateEl.textContent = `${year}年${month}月${day}日`;

            try {
                // 添加 no-cors 模式尝试绕过预检请求
                let response = await fetch(rawUrl, { mode: 'cors' });
                if (!response.ok) {
                    // 如果 cors 模式失败，尝试 no-cors (可能无法读取内容)
                    response = await fetch(rawUrl, { mode: 'no-cors' });
                    if (response.type === 'opaque') {
                        throw new Error('无法读取跨域资源');
                    }
                }
                const markdown = await response.text();
                contentDiv.innerHTML = simpleMarkdownParser(markdown);
            } catch (e) {
                console.error('日记加载失败:', e);
                // 最终尝试：使用一个 CORS 代理服务 (仅用于演示，生产环境不建议)
                try {
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`;
                    const proxyResponse = await fetch(proxyUrl);
                    if (proxyResponse.ok) {
                        const markdown = await proxyResponse.text();
                        contentDiv.innerHTML = simpleMarkdownParser(markdown);
                        return;
                    }
                } catch (proxyError) {
                    console.error('通过代理加载也失败:', proxyError);
                }
                contentDiv.innerHTML = `<p class="text-red-500">日记加载失败: ${e.message}。请尝试使用电脑端访问。</p>`;
            }
        }

        loadDiary();
    </script>
</body>
</html>
