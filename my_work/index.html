<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月历 | My Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 月历表格样式微调 */
        table td, table th {
            transition: background 0.2s;
        }
        table td:hover {
            background: #ebf5ff;
            cursor: default;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full">
        <!-- 标题与月份切换 -->
        <div class="flex items-center justify-between mb-6">
            <button id="prevMonth" class="p-2 rounded-lg hover:bg-gray-100 transition">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h2 id="monthYear" class="text-2xl font-bold text-primary"></h2>
            <button id="nextMonth" class="p-2 rounded-lg hover:bg-gray-100 transition">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- 月历表格 -->
        <table class="w-full text-center">
            <thead>
                <tr class="text-gray-500 text-sm">
                    <th class="py-2">日</th>
                    <th class="py-2">一</th>
                    <th class="py-2">二</th>
                    <th class="py-2">三</th>
                    <th class="py-2">四</th>
                    <th class="py-2">五</th>
                    <th class="py-2">六</th>
                </tr>
            </thead>
            <tbody id="calendarBody"></tbody>
        </table>

        <!-- 返回首页 -->
        <div class="mt-8 text-center">
            <a href="/" class="text-secondary hover:underline text-sm">
                <i class="fa-solid fa-arrow-left mr-1"></i>返回首页 / Back to Home
            </a>
        </div>
    </div>

    <script>
        const monthYearEl = document.getElementById('monthYear');
        const calendarBody = document.getElementById('calendarBody');
        const prevBtn = document.getElementById('prevMonth');
        const nextBtn = document.getElementById('nextMonth');

        let currentDate = new Date();

        function renderCalendar(date) {
            const year = date.getFullYear();
            const month = date.getMonth();

            // 设置头部年月
            monthYearEl.textContent = `${year} 年 ${month + 1} 月`;

            // 当月第一天是星期几（0=周日, 6=周六）
            const firstDay = new Date(year, month, 1).getDay();
            // 当月总天数
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // 生成表格行
            let html = '';
            let dayCount = 1;
            const totalCells = 42; // 6行7列

            for (let i = 0; i < 6; i++) {
                html += '<tr>';
                for (let j = 0; j < 7; j++) {
                    const cellIndex = i * 7 + j;
                    if (cellIndex < firstDay || dayCount > daysInMonth) {
                        html += '<td class="py-2 text-gray-300"></td>';
                    } else {
                        // 判断是否为今天
                        const today = new Date();
                        const isToday = (year === today.getFullYear() && month === today.getMonth() && dayCount === today.getDate());
                        const todayClass = isToday ? 'bg-secondary text-white rounded-full' : 'hover:bg-blue-50';
                        html += `<td class="py-2"><span class="inline-block w-8 h-8 leading-8 ${todayClass}">${dayCount}</span></td>`;
                        dayCount++;
                    }
                }
                html += '</tr>';
                if (dayCount > daysInMonth) break;
            }
            calendarBody.innerHTML = html;
        }

        prevBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar(currentDate);
        });

        nextBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar(currentDate);
        });

        // 初始显示
        renderCalendar(currentDate);
    </script>
</body>
</html>
