<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月历 | My Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 每个日期格子的基础样式 */
        table td {
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        /* 鼠标悬停时：整个格子背景变成暗红色 */
        table td:hover {
            background: #720E0E;
        }
        /* 悬停时格子内的文字（包括数字）统一变为白色 */
        table td:hover span {
            color: white;
        }
        /* 今天日期的默认样式：亮红色背景 + 白色文字 */
        .today-highlight {
            background-color: #e74c3c;
            color: white;
        }
        /* 悬停今天日期时，背景也跟随变为暗红色 */
        table td:hover .today-highlight {
            background-color: #720E0E;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full">
        <div class="flex items-center justify-between mb-6">
            <button id="prevMonth" class="p-2 rounded-lg hover:bg-gray-100 transition">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h2 id="monthYear" class="text-2xl font-bold text-primary"></h2>
            <button id="nextMonth" class="p-2 rounded-lg hover:bg-gray-100 transition">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <table class="w-full text-center">
            <thead>
                <tr class="text-gray-500 text-sm">
                    <th class="py-2">日</th>
                    <th class="py-2">一</th>
                    <th class="py-2">二</th>
                    <th class="py-2">三</th>
                    <th class="py-2">四</th>
                    <th class="py-2">五</th>
                    <th class="py-2">六</th>
                </tr>
            </thead>
            <tbody id="calendarBody"></tbody>
        </table>

        <div class="mt-8 text-center">
            <a href="/" class="text-secondary hover:underline text-sm">
                <i class="fa-solid fa-arrow-left mr-1"></i>返回首页
            </a>
        </div>
    </div>

    <script>
        // 跳转到日记页（diary.html?date=YYYYMMDD）
        function openDiary(dateStr) {
            window.location.href = `diary.html?date=${dateStr}`;
        }

        const monthYearEl = document.getElementById('monthYear');
        const calendarBody = document.getElementById('calendarBody');
        const prevBtn = document.getElementById('prevMonth');
        const nextBtn = document.getElementById('nextMonth');

        let currentDate = new Date();

        function renderCalendar(date) {
            const year = date.getFullYear();
            const month = date.getMonth();

            monthYearEl.textContent = `${year} 年 ${month + 1} 月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let html = '';
            let dayCount = 1;

            for (let i = 0; i < 6; i++) {
                html += '<tr>';
                for (let j = 0; j < 7; j++) {
                    const cellIndex = i * 7 + j;
                    if (cellIndex < firstDay || dayCount > daysInMonth) {
                        html += '<td class="py-2 text-gray-300"></td>';
                    } else {
                        const today = new Date();
                        const isToday = (year === today.getFullYear() && month === today.getMonth() && dayCount === today.getDate());
                        // 如果是今天，添加 today-highlight 类（亮红色背景）；否则不加任何背景类
                        const todayClass = isToday ? 'today-highlight rounded-full' : '';
                        const dateStr = `${year}${String(month + 1).padStart(2, '0')}${String(dayCount).padStart(2, '0')}`;
                        html += `<td class="py-2" onclick="openDiary('${dateStr}')">
                                    <span class="inline-block w-8 h-8 leading-8 ${todayClass}">${dayCount}</span>
                                 </td>`;
                        dayCount++;
                    }
                }
                html += '</tr>';
                if (dayCount > daysInMonth) break;
            }
            calendarBody.innerHTML = html;
        }

        prevBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar(currentDate);
        });

        nextBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar(currentDate);
        });

        // 首次加载
        renderCalendar(currentDate);
    </script>
</body>
</html>
