<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记查看</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .markdown-body {
            padding: 1rem;
            background: white;
            border-radius: 0.75rem;
            line-height: 1.7;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .markdown-body h1 { font-size: 1.8rem; font-weight: bold; margin-bottom: 0.8rem; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.6rem; }
        .markdown-body h3 { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.4rem; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body code {
            background: #f3f4f6;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.9em;
        }
        .markdown-body pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        .markdown-body blockquote {
            border-left: 4px solid #9ca3af;
            padding-left: 1rem;
            color: #4b5563;
            margin-bottom: 1rem;
        }
        .markdown-body a {
            color: #3498db;
            text-decoration: underline;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-3xl w-full">
        <div id="note-title" class="text-2xl font-bold text-primary mb-2">笔记</div>
        <div id="note-meta" class="text-gray-500 mb-6"></div>
        
        <div id="note-content" class="markdown-body">
            加载中...
        </div>

        <div class="mt-8 text-center">
            <a href="javascript:history.back()" class="text-secondary hover:underline text-sm">
                <i class="fa-solid fa-arrow-left mr-1"></i>返回列表
            </a>
        </div>
    </div>

    <script>
        // 简易 Markdown 解析器
        function simpleMarkdownParser(md) {
            if (!md) return '';
            let html = md;
            html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            // 简单列表处理（与之前相同）
            html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>(\n|$))+/g, '<ul>$&</ul>');
            // 简单段落处理
            const lines = html.split('\n');
            let result = [];
            let buffer = [];
            for (let line of lines) {
                if (/^\s*<(h[1-6]|ul|ol|li|pre|blockquote)/.test(line) || /^\s*<\/(ul|ol)>/.test(line)) {
                    if (buffer.length) { result.push('<p>' + buffer.join(' ') + '</p>'); buffer = []; }
                    result.push(line);
                } else if (line.trim() === '') {
                    if (buffer.length) { result.push('<p>' + buffer.join(' ') + '</p>'); buffer = []; }
                } else {
                    buffer.push(line);
                }
            }
            if (buffer.length) result.push('<p>' + buffer.join(' ') + '</p>');
            return result.join('\n');
        }

        const params = new URLSearchParams(window.location.search);
        const filePath = params.get('path');
        if (!filePath) {
            document.getElementById('note-content').innerHTML = '<p class="text-red-500">缺少笔记路径</p>';
        } else {
            // 从路径提取课程和文件名
            const parts = filePath.split('/');
            const course = parts[1] || '';
            const fileName = parts[parts.length - 1];
            document.getElementById('note-title').textContent = decodeURIComponent(fileName.replace(/\.md$/i, ''));
            document.getElementById('note-meta').textContent = `课程：${course}`;

            // 构造 raw URL
            const rawUrl = `https://raw.githubusercontent.com/youqishan/youqishan.github.io/master/${filePath}`;
            fetch(rawUrl)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.text();
                })
                .then(md => {
                    document.getElementById('note-content').innerHTML = simpleMarkdownParser(md);
                })
                .catch(err => {
                    document.getElementById('note-content').innerHTML = `<p class="text-red-500">加载失败: ${err.message}</p>`;
                });
        }
    </script>
</body>
</html>
