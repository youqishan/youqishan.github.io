<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记查看</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-body {
            padding: 1rem;
            background: white;
            border-radius: 0.75rem;
            line-height: 1.7;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .markdown-body h1 { font-size: 1.8rem; font-weight: bold; margin-bottom: 0.8rem; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.6rem; }
        .markdown-body h3 { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.4rem; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body code {
            background: #f3f4f6;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.9em;
        }
        .markdown-body pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        .markdown-body blockquote {
            border-left: 4px solid #9ca3af;
            padding-left: 1rem;
            color: #4b5563;
            margin-bottom: 1rem;
        }
        .markdown-body a {
            color: #3498db;
            text-decoration: underline;
        }
        .plain-text {
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 1rem;
            background: white;
            border-radius: 0.75rem;
            line-height: 1.7;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-3xl w-full">
        <div id="note-title" class="text-2xl font-bold text-primary mb-2">笔记</div>
        <div id="note-meta" class="text-gray-500 mb-6"></div>
        
        <div id="note-content" class="markdown-body">
            <!-- 内容由JS加载 -->
        </div>

        <div class="mt-8 text-center">
            <a href="javascript:history.back()" class="text-secondary hover:underline text-sm">
                <i class="fa-solid fa-arrow-left mr-1"></i>返回列表
            </a>
        </div>
    </div>

    <script>
        // 用一个大的匿名函数包裹全部逻辑，彻底避免全局 return
        (function() {
            // 检查 marked 是否可用，不可用则显示错误并结束
            if (typeof marked === 'undefined') {
                document.getElementById('note-content').innerHTML = '<p class="text-red-500">Markdown 解析库加载失败，请稍后重试。</p>';
                return; // 这个 return 在匿名函数内，是合法的
            }

            // 主逻辑使用 async IIFE
            (async function() {
                const cache = new Map();
                const contentDiv = document.getElementById('note-content');
                const noteTitle = document.getElementById('note-title');
                const noteMeta = document.getElementById('note-meta');

                const params = new URLSearchParams(window.location.search);
                const filePath = params.get('path');

                if (!filePath) {
                    contentDiv.innerHTML = '<p class="text-red-500">缺少笔记路径</p>';
                    return;
                }

                // 提取课程和文件名
                const parts = filePath.split('/');
                const course = parts[1] || '';
                const fileName = parts[parts.length - 1];
                noteTitle.textContent = decodeURIComponent(fileName.replace(/\.(md|txt)$/i, ''));
                noteMeta.textContent = `课程：${course}`;

                const isPlainText = fileName.toLowerCase().endsWith('.txt');

                // 检查缓存
                if (cache.has(filePath)) {
                    renderContent(cache.get(filePath));
                    return;
                }
                const sessionCached = sessionStorage.getItem(filePath);
                if (sessionCached) {
                    cache.set(filePath, sessionCached);
                    renderContent(sessionCached);
                    return;
                }

                contentDiv.innerHTML = '<p class="text-gray-400">加载中...</p>';

                // 构造 URL（优先 CDN，回退 Raw）
                const rawUrl = `https://raw.githubusercontent.com/youqishan/youqishan.github.io/master/${filePath}`;
                const cdnUrl = `https://cdn.jsdelivr.net/gh/youqishan/youqishan.github.io@master/${filePath}`;

                async function fetchWithFallback() {
                    try {
                        const response = await fetch(cdnUrl);
                        if (response.ok) return response;
                    } catch (e) {
                        console.warn('CDN 加载失败，回退到原始源', e);
                    }
                    return await fetch(rawUrl);
                }

                function renderContent(text) {
                    if (isPlainText) {
                        contentDiv.className = 'plain-text';
                        contentDiv.textContent = text;
                    } else {
                        contentDiv.className = 'markdown-body';
                        contentDiv.innerHTML = marked.parse(text);
                    }
                }

                try {
                    const response = await fetchWithFallback();
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const text = await response.text();
                    // 缓存数据
                    cache.set(filePath, text);
                    try { sessionStorage.setItem(filePath, text); } catch (e) { /* 忽略 */ }
                    renderContent(text);
                } catch (err) {
                    contentDiv.innerHTML = `<p class="text-red-500">加载失败: ${err.message}</p>`;
                }
            })();
        })();
    </script>
</body>
</html>
