<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记查看</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 marked.js CDN (使用备用链接提升稳定性) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-body {
            padding: 1rem;
            background: white;
            border-radius: 0.75rem;
            line-height: 1.7;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .markdown-body h1 { font-size: 1.8rem; font-weight: bold; margin-bottom: 0.8rem; }
        .markdown-body h2 { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.6rem; }
        .markdown-body h3 { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.4rem; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body code {
            background: #f3f4f6;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-size: 0.9em;
        }
        .markdown-body pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        .markdown-body blockquote {
            border-left: 4px solid #9ca3af;
            padding-left: 1rem;
            color: #4b5563;
            margin-bottom: 1rem;
        }
        .markdown-body a {
            color: #3498db;
            text-decoration: underline;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-lg p-8 max-w-3xl w-full">
        <div id="note-title" class="text-2xl font-bold text-primary mb-2">笔记</div>
        <div id="note-meta" class="text-gray-500 mb-6"></div>
        
        <div id="note-content" class="markdown-body">
            <!-- 动态渲染内容 -->
        </div>

        <div class="mt-8 text-center">
            <a href="javascript:history.back()" class="text-secondary hover:underline text-sm">
                <i class="fa-solid fa-arrow-left mr-1"></i>返回列表
            </a>
        </div>
    </div>

    <script>
        // 如果 marked 库加载失败，启用备用方案
        if (typeof marked === 'undefined') {
            document.getElementById('note-content').innerHTML = '<p class="text-red-500">Markdown 解析库加载失败，请稍后重试。</p>';
            throw new Error('marked.js not loaded');
        }

        // 全局缓存 Map
        const cache = new Map();

        const params = new URLSearchParams(window.location.search);
        const filePath = params.get('path');
        if (!filePath) {
            document.getElementById('note-content').innerHTML = '<p class="text-red-500">缺少笔记路径</p>';
        } else {
            // 从路径提取课程和文件名
            const parts = filePath.split('/');
            const course = parts[1] || '';
            const fileName = parts[parts.length - 1];
            document.getElementById('note-title').textContent = decodeURIComponent(fileName.replace(/\.md$/i, ''));
            document.getElementById('note-meta').textContent = `课程：${course}`;

            // 检查缓存
            if (cache.has(filePath)) {
                const cached = cache.get(filePath);
                document.getElementById('note-content').innerHTML = marked.parse(cached);
                return;
            }

            // 尝试从 sessionStorage 读取缓存
            const sessionCache = sessionStorage.getItem(filePath);
            if (sessionCache) {
                cache.set(filePath, sessionCache);
                document.getElementById('note-content').innerHTML = marked.parse(sessionCache);
                return;
            }

            // 显示加载状态
            document.getElementById('note-content').innerHTML = '<p class="text-gray-400">加载中...</p>';

            // 构造原始 URL 和 CDN URL ( jsdelivr CDN )
            const rawUrl = `https://raw.githubusercontent.com/youqishan/youqishan.github.io/master/${filePath}`;
            const cdnUrl = `https://cdn.jsdelivr.net/gh/youqishan/youqishan.github.io@master/${filePath}`;

            // 使用 Promise.any 或者优先尝试 CDN，失败再尝试 raw
            async function fetchWithFallback() {
                try {
                    // 优先使用 CDN
                    const response = await fetch(cdnUrl);
                    if (response.ok) return response;
                } catch (e) {
                    console.warn('CDN 加载失败，回退到原始源', e);
                }
                // 回退到原始源
                return await fetch(rawUrl);
            }

            fetchWithFallback()
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.text();
                })
                .then(md => {
                    // 缓存数据
                    cache.set(filePath, md);
                    try {
                        sessionStorage.setItem(filePath, md);
                    } catch (e) {
                        // sessionStorage 可能已满
                    }
                    document.getElementById('note-content').innerHTML = marked.parse(md);
                })
                .catch(err => {
                    document.getElementById('note-content').innerHTML = `<p class="text-red-500">加载失败: ${err.message}</p>`;
                });
        }
    </script>
</body>
</html>
